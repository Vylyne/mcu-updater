name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint and type-check once, on the floor rather than a modern interpreter.
  # mypy rejects `--python-version 3.9` but runs fine *on* 3.9 and then targets
  # it, so this is what checks src against the stdlib the printer actually has;
  # on 3.13 it would check against 3.13's and miss exactly that. If a future
  # mypy drops 3.9 entirely, move this back to a modern interpreter and accept
  # that the matrix below is the only floor guarantee again.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor because that is what ships on the Raspberry Pi OS
        # release most printers run. Actually executing the suite there is the
        # real compatibility guarantee.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  # The tool only ever runs on Linux, but it is developed on Windows, so the
  # test suite has to stay green there or the seams have stopped working.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
