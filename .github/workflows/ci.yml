name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint and type-check once, on a modern interpreter. Both tools pin the floor
  # from pyproject (`target-version`, `python_version`) rather than inheriting
  # it from whatever runs them, so this is a real floor check wherever it runs.
  # That only became true at 3.11 - mypy rejects `python_version` below 3.10,
  # so the old 3.9 floor forced this job onto a 3.9 interpreter.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (Raspberry Pi OS Bookworm); 3.13 is what the
        # printers actually run today (Trixie). Executing the suite on the floor
        # is the real compatibility guarantee - static analysis cannot see a
        # too-new stdlib call inside an unannotated test.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  # The tool only ever runs on Linux, but it is developed on Windows, so the
  # test suite has to stay green there or the seams have stopped working.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
