name: ui-ci

# Non-mutating variants only (lint, typecheck, build, test, format --check),
# per the fork's own rule (docs/decisions.md): a mutating gate lets CI pass by
# rewriting the code it is supposed to police.

on:
  push:
    branches: [main]
    paths: ["ui/**", ".github/workflows/ui-ci.yml"]
  pull_request:
    paths: ["ui/**", ".github/workflows/ui-ci.yml"]

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # jsdom 30's engines field is ^22.22.2 || ^24.15.0 || >=26.0.0 - 20
          # is not in that range at all, and fails at test time with
          # "webidl.util.markAsUncloneable is not a function" from undici's
          # Cache implementation, not at install time, so npm ci looks fine.
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        # Unlike the Mainsail fork (docs/decisions.md), this is a greenfield
        # <script setup lang="ts"> tree, so vue-tsc actually sees it.
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test
