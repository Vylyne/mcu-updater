name: ui-ci

# Non-mutating variants only (lint, typecheck, build, test, format --check),
# per the fork's own rule (docs/decisions.md): a mutating gate lets CI pass by
# rewriting the code it is supposed to police.

on:
  push:
    branches: [main]
    paths: ["ui/**", ".github/workflows/ui-ci.yml"]
  pull_request:
    paths: ["ui/**", ".github/workflows/ui-ci.yml"]

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        # Unlike the Mainsail fork (docs/decisions.md), this is a greenfield
        # <script setup lang="ts"> tree, so vue-tsc actually sees it.
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test
