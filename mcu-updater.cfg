# mcu-updater configuration.
#
# Lives in printer_data/config so it is backed up with the rest of your config
# and editable in Mainsail. Built firmware is NOT here - it goes in
# ~/printer_data/mcu-updater, because binaries have no business in a config
# directory that gets git-committed.
#
# Comments in this file survive edits made from the panel.

# Tool settings. Every value has a default, so this whole section is optional.
[updater]
# Flashing from the web UI is off unless you turn it on. The CLI ignores this.
#enable_flashing: true
# 0 = no -j flag at all (matches the original behaviour); negative = one per CPU.
#make_jobs: 0
# Leave clean_before_build on: skipping it after a .config change is how you
# flash a subtly wrong binary.
#clean_before_build: true
# klipper-1, klipper-2, ... for KIAUH multi-instance setups. Also the level a
# per-type or per-firmware stop_services: overrides - see [type knomi] below.
#stop_services: klipper
#dry_run: false

# A firmware family: a source tree, how it is built, what it emits. klipper
# and katapult need no section at all unless you are overriding them - both
# already default to the ~/<name> / kconfig_make / out/<name>.bin convention.

# A vendor fork that doesn't follow that convention gets its own section. It
# IS klipper, so its Makefile still emits out/klipper.bin - keep artifact:
# pointed at the parent's output name rather than the fork's own.
[firmware cartographer]
source: ~/cartographer-klipper
artifact: klipper

# PlatformIO tree, one repo shared by every ESP32 env it contains.
[firmware knomi_serial]
source: ~/knomi_serial
builder: platformio

# The MCU registry: one [type <name>] section per board model, listing every
# physical board of that model by its /dev/serial/by-id serial.

[type bttebb36]
chipset: stm32g0b1xx
firmware: klipper, katapult
serials:
    230048001750304158373620-if00  # mcu EBBT0
    290055001850304158373620-if00  # mcu EBBT1
    320019000451343438333339-if00
    27000E000551343438333339-if00

[type flylllplusbuffer]
chipset: stm32f072xb
firmware: klipper, katapult
klipper_makefile_patches:
    src/Makefile -> src-y += buffer.c
serials:
    4C0033000957465331323720-if00  # mcu T0_buffer
    3F0037000957465331323720-if00  # mcu T1_buffer
    2B0038000957465331323720-if00  # mcu T2_buffer
    440037000957465331323720-if00  # mcu T3_buffer
    400030000957465331323720-if00  # mcu T4_buffer
    190031000957465331323720-if00  # mcu T5_buffer

[type hexadistrofusion]
chipset: stm32f072xb
firmware: klipper, katapult
serials:
    4B0036000A53594731383520-if00

[type OctopusMAXEZ]
chipset: stm32h723xx
firmware: klipper, katapult
serials:
    210008000551333231343036-if00

[type cartographer]
chipset: stm32g431xx
firmware: cartographer, katapult
profile: config.CartoV4USB
serials:

# ESP32 display, built by PlatformIO instead of make+Kconfig - see the README.
[type knomi]
chipset: esp32
firmware: knomi_serial
env: knomi                        # the PlatformIO env to build
# The canonical override: names everything this write needs. A knomi's own
# klippy module holds its tty, same as klipper holds a board's - so leaving
# klipper off this line would let it keep the port during the write.
stop_services: klipper, knomi_serial
