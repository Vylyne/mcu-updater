[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcu-updater"
version = "0.9.0"
description = "Klipper/Katapult MCU firmware management with a Moonraker agent and Mainsail UI"
readme = "README.md"
requires-python = ">=3.9"
# Deliberately empty. See docs/ - the agent talks to Moonraker over a unix
# socket with nothing but the stdlib, and kconfiglib is loaded out of the
# klipper/katapult source trees rather than pip (a PyPI copy would disagree
# with klipper's locally patched one).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout", "ruff", "mypy"]

[project.scripts]
updatefw = "mcu_updater.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 110
# Third-party code vendored verbatim as a test fixture. Linting it reports 125
# problems that are not ours, and `--fix` would silently rewrite upstream source -
# which would defeat the point of testing against the real library.
extend-exclude = ["tests/fixtures/kconfiglib"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501", # line length is handled by the formatter, not worth failing CI over
    # PEP 604 (`X | None`) is only safe here because every module has
    # `from __future__ import annotations`. The runtime target is Python 3.9,
    # where `Optional[X]` works in every position - including any spot where an
    # annotation does get evaluated. Keeping the explicit typing form means a
    # future edit that drops a `__future__` import can't turn into a
    # TypeError at import time on the printer.
    "UP007",
    "UP045",
]

[tool.mypy]
# Deliberately no `python_version = "3.9"`: mypy refuses that flag outright
# ("must be 3.10 or higher"). It does, however, still *run* on 3.9 and then
# targets whatever interpreter it runs under - so invoking it from a 3.9
# environment is how this gets checked against the floor, and is what CI's
# static job does. Under a newer interpreter `mypy src` silently checks against
# that version's stdlib instead, which is a weaker check than it looks.
#
# Note this cannot police the test suite the same way. Test functions take
# unannotated fixtures, so `tmp_path` is `Any` and a call on it is unchecked -
# even with --check-untyped-defs. Running pytest on 3.9 is the only thing that
# catches a 3.10+ stdlib API in a test, and CI's matrix is what does it.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 60
