[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcu-updater"
version = "0.9.0"
description = "Klipper/Katapult MCU firmware management with a Moonraker agent and Mainsail UI"
readme = "README.md"
requires-python = ">=3.11"
# Deliberately empty. See docs/ - the agent talks to Moonraker over a unix
# socket with nothing but the stdlib, and kconfiglib is loaded out of the
# klipper/katapult source trees rather than pip (a PyPI copy would disagree
# with klipper's locally patched one).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout", "ruff", "mypy"]

[project.scripts]
updatefw = "mcu_updater.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
# Third-party code vendored verbatim as a test fixture. Linting it reports 125
# problems that are not ours, and `--fix` would silently rewrite upstream source -
# which would defeat the point of testing against the real library.
extend-exclude = ["tests/fixtures/kconfiglib"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501", # line length is handled by the formatter, not worth failing CI over
    # Pending removal now the floor is 3.11. These were ignored because the
    # runtime target was 3.9, where only `Optional[X]` is safe in a position an
    # annotation actually gets evaluated - so a future edit dropping a
    # `from __future__ import annotations` could not become a TypeError at
    # import time on the printer. At 3.11 PEP 604 is valid at runtime
    # everywhere, so that reason is gone. Kept for exactly one commit to keep
    # the floor bump a small diff; the sweep is its own change.
    "UP007",
    "UP045",
]

[tool.mypy]
# Pins the floor, so `mypy src` is honest on whatever interpreter it runs under
# - including the much newer one a dev box will have. This is only possible
# because the floor is 3.11: mypy rejects `python_version` below 3.10 outright,
# which is why the old 3.9 floor could only be checked by *running* mypy on a
# 3.9 interpreter.
#
# It still cannot police the test suite. Test functions take unannotated
# fixtures, so `tmp_path` is `Any` and any call on it is unchecked - even with
# --check-untyped-defs. Running pytest on a floor interpreter is the only thing
# that catches a too-new stdlib API in a test, and CI's matrix is what does it.
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 60
