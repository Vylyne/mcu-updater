# Appended to ~/printer_data/config/moonraker.conf by install.sh, alongside
# (not instead of) scripts/moonraker-update-manager.conf. This section tracks
# the standalone UI (ui/), which releases on its own tag-driven cadence and is
# therefore `type: web`, not `type: git_repo` like the agent itself - see
# docs/decisions.md and .github/workflows/ui-release.yml.
#
# `path` must be UI_PATH from install.sh, kept in sync by hand: Moonraker
# rmtree()s this directory on every update, and nginx's root (see
# scripts/nginx.sites-available-mcu-updater) is baked from the same variable
# at install time. Moving one without the other silently serves stale files
# or leaves nginx pointing at nothing.

[update_manager mcu-updater-ui]
type: web
repo: Vylyne/mcu-updater
path: ~/mcu-updater-ui
channel: stable
