# Appended to ~/printer_data/config/moonraker.conf by install.sh.
# Lets Mainsail's Update Manager panel show and update mcu-updater.
#
# No `virtualenv:` or `requirements:` keys: the agent itself has no Python
# dependencies at all, running on the system python3 with nothing but the
# standard library. That is the payoff of the stdlib-only decision - nothing to
# rebuild after an OS upgrade, and no venv for the update manager to reinstall.
#
# `system_dependencies` below is not a contradiction. Display discovery shells
# out to the system python3 to ask the screens which they are, and *that* needs
# pyserial - a system package, installed once, not a Python environment we own.

[update_manager mcu-updater]
type: git_repo
path: ~/mcu-updater
origin: https://github.com/Vylyne/mcu-updater.git
primary_branch: main
#
# managed_services must name this section, or `klipper`, or `moonraker` -
# Moonraker validates it against exactly those three and rejects anything else.
# That is why the unit and this section share a name.
managed_services: mcu-updater
# Replaces `install_script`, which is deprecated and which this only ever used
# to name a package list. Not to be confused with `requirements`, which names
# Python packages for a virtualenv - there is no virtualenv here, and these are
# system packages.
system_dependencies: scripts/moonraker-system-dependencies.json
