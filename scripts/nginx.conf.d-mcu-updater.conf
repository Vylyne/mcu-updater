# Rendered by install.sh - no %PLACEHOLDERS% here, only fixed content.
# Installed to /etc/nginx/conf.d/mcu-updater.conf
#
# KIAUH/MainsailOS installs already carry /etc/nginx/conf.d/upstreams.conf
# (upstream apiserver -> 127.0.0.1:7125) and common_vars.conf (the
# $connection_upgrade map). This site does not depend on either - a hand-rolled
# nginx install may not have them, and declaring the same symbol twice is a
# config-load error, not a harmless duplicate. So this ships its own upstream
# and its own map, under names that cannot collide with theirs.

upstream mcu_updater_apiserver {
    ip_hash;
    server 127.0.0.1:7125;
}

map $http_upgrade $mcu_updater_connection_upgrade {
    default upgrade;
    ''      close;
}
