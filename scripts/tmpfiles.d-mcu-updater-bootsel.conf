# Parent directories for the BOOTSEL mountpoints the udev rule creates. The
# rule mounts three levels deep, at /media/<owner>/BOOTSEL/by-path/<tag>.
# systemd-mount will create those parents itself, so this is not what makes
# the mount work; it pre-creates them owned by the printer's user at a known
# mode rather than leaving root-owned directories created implicitly at mount
# time.
#
# The age field on the second line is the mountpoint cleanup. `--collect`
# reaps the transient mount *unit* on unplug but leaves the directory, so an
# empty directory per USB port accumulates. systemd-tmpfiles-clean.timer
# sweeps anything under by-path older than an hour, which is exactly those
# leftovers. It cannot touch a board that is currently mounted: an active
# mountpoint is busy, and the kernel refuses to remove it.
#
# This is deliberately not a udev ACTION=="remove" rule. That was tried (rule
# version 3) and confirmed on hardware to lose a race it cannot win - udev
# runs the remove event while systemd is still tearing the mount down, so the
# rmdir always failed EBUSY and logged an error on every single unplug.
#
# Installed by mcu-updater's install.sh, which substitutes that owner's name
# into the directives below.
d /media/%USER%/BOOTSEL 0755 %USER% %USER% -
d /media/%USER%/BOOTSEL/by-path 0755 %USER% %USER% 1h
