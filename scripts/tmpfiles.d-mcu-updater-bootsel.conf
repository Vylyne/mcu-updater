# Parent directories for the BOOTSEL mountpoints the udev rule creates. The
# rule mounts three levels deep, at /media/<owner>/BOOTSEL/by-path/<tag>.
# systemd-mount will create those parents itself, so this is not what makes
# the mount work; it pre-creates them owned by the printer's user at a known
# mode rather than leaving root-owned directories created implicitly at mount
# time.
#
# The age field on the second line is the backstop for mountpoint cleanup.
# `--collect` reaps the transient mount *unit* on unplug but leaves the
# directory, so an empty directory per USB port would otherwise accumulate.
# The udev rule handles the common case promptly (it schedules an rmdir ten
# seconds after the remove event, once the unmount has settled); this sweeps
# whatever that missed - a board replugged inside those ten seconds, a host
# where the rule never ran, or directories left by an older rule version.
# systemd-tmpfiles-clean.timer is daily, so this is slow by design: it is the
# net, not the mechanism. It cannot touch a mounted board either way - an
# active mountpoint is busy, and the kernel refuses to remove it.
#
# Installed by mcu-updater's install.sh, which substitutes that owner's name
# into the directives below.
d /media/%USER%/BOOTSEL 0755 %USER% %USER% -
d /media/%USER%/BOOTSEL/by-path 0755 %USER% %USER% 1h
