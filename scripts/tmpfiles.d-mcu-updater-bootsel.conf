# Parent directories for the BOOTSEL mountpoints the udev rule creates. The
# rule mounts at /media/%USER%/BOOTSEL/by-path/<tag>, three levels deep.
# systemd-mount will create those parents itself, so this is not what makes
# the mount work; it pre-creates them owned by %USER% at a known mode rather
# than leaving root-owned directories created implicitly at mount time.
# Installed by mcu-updater's install.sh. %USER% is substituted there.
d /media/%USER%/BOOTSEL 0755 %USER% %USER% -
d /media/%USER%/BOOTSEL/by-path 0755 %USER% %USER% -
